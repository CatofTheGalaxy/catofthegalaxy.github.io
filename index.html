<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
	<link rel="icon" type="image/png" href="https://static.skport.com/image/common/20260122/445ff7677cd4a79ab4993d25ea251bcf.png">

	<!-- Primary Meta Tags -->
	<title>Endfield - Report Dashboard</title>
	<link rel="icon" type="image/x-icon" href="https://assets.skport.com/assets/favicon.ico">

	<meta name="title" content="Endfield - Report Dashboard">
	<meta name="description" content="Arknights Endfield - Auto claim dialy">

	<!-- Open Graph / Facebook -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="http://catofthegalaxy.github.io/">
	<meta property="og:title" content="Endfield - Report Dashboard">
	<meta property="og:description" content="Arknights Endfield - Auto claim dialy">
	<meta property="og:image" content="https://static.skport.com/image/rm42wiki/20260329/2452982252316/69c8b5fe7c2305399ff6da54_2f76db19.png">

	<!-- Twitter -->
	<meta property="twitter:card" content="summary_large_image">
	<meta property="twitter:url" content="http://catofthegalaxy.github.io/">
	<meta property="twitter:title" content="Endfield - Report Dashboard">
	<meta property="twitter:description" content="Arknights Endfield - Auto claim dialy">
	<meta property="twitter:image" content="https://static.skport.com/image/rm42wiki/20260329/2452982252316/69c8b5fe7c2305399ff6da54_2f76db19.png">

	<style>
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		html, body {
			width: 100%;
			height: 100dvh;
			overflow: hidden;
			background-color: #0d1117;
			font-family: system-ui, -apple-system, sans-serif;
		}
		#loader {
			position: fixed;
			inset: 0;
			z-index: 9999;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			background-color: #0d1117;
			color: #e6edf3;
			transition: opacity 0.45s ease, visibility 0.45s ease;
		}
		#loader.fade-out {
			opacity: 0;
			visibility: hidden;
			pointer-events: none;
		}
		.spinner {
			width: 40px;
			height: 40px;
			border: 3px solid rgba(255, 255, 255, 0.15);
			border-top-color: #38bdf8;
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}
		.loader-text {
			font-size: 14px;
			letter-spacing: 0.5px;
			color: #9ba1a6;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		iframe {
			display: block;
			width: 100%;
			height: 100dvh;
			border: none;
			overflow: hidden;
		}
	</style>
</head>
<body>
	<div id="loader">
		<div class="spinner"></div>
		<div class="loader-text">Loading Endfield - Report Dashboard...</div>
	</div>
	<iframe
		id="app-frame"
		src="https://script.google.com/macros/s/AKfycbzqcvZywKppsi0bcuKkDw6XlnmpRSQL2h07mkTCKtBcwmwK4V9jLdI29yrt-sqQEMg6/exec"
		title="Endfield - Report Dashboard"
		allow="fullscreen"
		allowfullscreen
		scrolling="no"
	></iframe>
	<script>
		const frame = document.getElementById('app-frame');
		const loader = document.getElementById('loader');
		const hideLoader = () => loader.classList.add('fade-out');
		frame.addEventListener('load', hideLoader);
		setTimeout(hideLoader, 10000);
	</script>
</body>
</html>
