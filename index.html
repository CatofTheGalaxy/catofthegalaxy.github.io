	<style>
		*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
		html,body{width:100%;height:100dvh;overflow:hidden;background:#0d1117;font-family:system-ui,-apple-system,sans-serif}
		#loader{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0d1117;color:#e6edf3;transition:opacity .45s ease,visibility .45s ease}
		#loader.fade-out{opacity:0;visibility:hidden;pointer-events:none}
		.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.15);border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite}
		.loader-text{font-size:14px;letter-spacing:.5px;color:#9ba1a6}
		@keyframes spin{to{transform:rotate(360deg)}}
		iframe{display:block;width:100%;height:100dvh;border:none;overflow:hidden}
	</style>
</head>
<body>
	<div id="loader"><div class="spinner"></div><div class="loader-text">Loading Endfield - Report Dashboard...</div></div>
	<iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbzqcvZywKppsi0bcuKkDw6XlnmpRSQL2h07mkTCKtBcwmwK4V9jLdI29yrt-sqQEMg6/exec" title="Endfield - Report Dashboard" allow="fullscreen" allowfullscreen scrolling="no"></iframe>
	<script>
		const f=document.getElementById("app-frame"),l=document.getElementById("loader"),h=()=>l.classList.add("fade-out");f.addEventListener("load",h);setTimeout(h,1e4);
	</script>
</body>
</html>
